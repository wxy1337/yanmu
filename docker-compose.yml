services:
  yanmu:
    build: .
    container_name: yanmu
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - whisper-models:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  whisper-models:

